[package]
name = "embed-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-graphics = { version = "0.8.2", features = ["fixed_point"] }
embedded-graphics-framebuf = "0.5.0"

heapless = { version = "0.9.3" }
enum_dispatch = "0.3.13"
defmt = { version = "1.0.1", optional = true }
thiserror = { version = "2.0.18", default-features = false }

[features]
defmt = ["dep:defmt", "heapless/defmt", "embedded-graphics/defmt"]

[lints.clippy]
new_without_default = "allow"
